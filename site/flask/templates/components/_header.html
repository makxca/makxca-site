
<header class="header">
    <button class="menuButton">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor" class="menuIcon">
            <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
        </svg>
    </button>
    <ul class="menuList" id="header-menu-list">
        <h3 class="title">{{translations.contents}}</h3>
        {% for content in contents %}
            <li>
                <a href="{{ content.url }}/{{language}}" class="">{{ content.label }}</a>
            </li>
        {% endfor %}
    </ul>
    <nav id="header-navigation">
        <ul class="navigation">
            {% for navigationItme in navigation %}
                <li>
                    <a href="/flask/{{ language }}{{ navigationItme.url }}" class="">{{ translations[navigationItme.label] }}</a>
                </li>
            {% endfor %}
        </ul>
    </nav>
    <div class="dropdown" id="header-language-dropdown">
        <button>&nbsp;</button> <!-- button for opening dropdown -->
        <ul class="menu">
            <h3 class="dropdownTitle">{{translations.selectLanguage}}</h3>
            <li>
                <a data-language="en">English</a>
            </li>
            <li>
                <a data-language="ru">Русский</a>
            </li>
        </ul>
    </div>
</header>
<script>
    {
      // script for menu visibility

      const menuButton = document.querySelector('.menuButton');
      const menuList = document.querySelector('#header-menu-list');

      const toggleMenu = () => {
          menuList.classList.toggle('open');
      }
      
      menuButton.addEventListener('click', toggleMenu);

      const handleClickOutsideMenuList = (event) => {
          if (menuList && menuList.classList.contains('open') && !menuList.contains(event.target)) {
              toggleMenu()
          }
      }

      document.addEventListener('mouseup', handleClickOutsideMenuList)
      document.addEventListener('touchend', handleClickOutsideMenuList)
    }
</script>
<script>
  {
    // script for color of menu elements

    const menuListLinks = document.querySelectorAll('#header-menu-list a');
    menuListLinks.forEach(link => {
      if (/flask/.test(link.getAttribute('href'))) {
        link.classList.add('active');
      }
    });
  }
</script>
<script>
  {
    // script for color of navigation elements

    const navigationLinks = document.querySelectorAll('#header-navigation a');
    navigationLinks.forEach(link => {
      if (window.location.pathname.replace(/\/$/, '') === link.getAttribute('href').replace(/\/$/, '')) {
        link.classList.add('active');
      }
    });
  }
</script>
<script>
  {
    // script for language dropdown

    const languageDropdown = document.querySelector('#header-language-dropdown');
    const languageDropdownButton = document.querySelector('#header-language-dropdown button');
    const languageDropdownMenu = document.querySelector('#header-language-dropdown .menu');
    const languageDropdownMenuLinks = document.querySelectorAll('#header-language-dropdown .menu a');

    const toggleLanguageDropdown = () => {
        languageDropdownMenu.classList.toggle('open');
    }

    languageDropdownButton.addEventListener('click', toggleLanguageDropdown);

    const handleClickOutsideMenu = (event) => {
      if (languageDropdownMenu && languageDropdownMenu.classList.contains('open') && !languageDropdownMenu.contains(event.target)) {
            toggleLanguageDropdown()
        }
    }

    document.addEventListener('mouseup', handleClickOutsideMenu)
    document.addEventListener('touchend', handleClickOutsideMenu)


    languageDropdownMenuLinks.forEach(link => {
      link.setAttribute('href', `/flask/${link.getAttribute('data-language')}/${window.location.pathname.split('/').slice(3).join('')}`);
      link.removeAttribute('data-language');
    });

    const LanguageByLang = {
        ru: 'Русский',
        en: 'English',
    }
    languageDropdownButton.textContent = LanguageByLang["{{language}}"];
  }
</script>
