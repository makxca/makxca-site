apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  labels:
    app: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: makxca/makxca-site:flask1.0.3
          ports:
            - containerPort: 3000
          env:
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: PUBLIC_URL
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30001
